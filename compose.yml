services:
  database:
    image: 'postgres:latest'
    container_name: postgres
    env_file:
      - .env
    volumes:
      - database_data:/var/lib/postgresql/data 
    networks:
      - private

  backend:
    image: 'zoomerrremover/flaskapp:0.1'
    container_name: flask_app
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    networks:
      - public
      - private
    depends_on:
    - database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/about"]
      interval: 5s
      retries: 5
      start_period: 15s
      timeout: 5s

  nginx:
    image: nginx:1.26.1-alpine
    ports:
      - 8080:8080
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    networks:
      - public
    depends_on:
      backend:
        condition: service_healthy
        restart: true


configs:
  nginx_config:
    file: ./nginx.conf

volumes:
  database_data:

networks:
  public:
  private:
